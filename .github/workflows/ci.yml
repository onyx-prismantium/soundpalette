name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (PLAN.md §2)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git pkg-config \
            xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libgl1-mesa-dev \
            libasound2-dev libpulse-dev \
            libgtk-3-dev libdbus-1-dev \
            ffmpeg libxml2-utils xvfb

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Generate test fixtures (deterministic, PLAN.md §11)
        run: |
          ./build/tools/genfixtures/genfixtures tests/golden/fixtures
          bash tests/integration/make_lossy.sh tests/golden/fixtures

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Integration tests
        run: |
          for s in tests/integration/*.sh; do
            echo "== $s"
            bash "$s" || exit 1
          done

      - name: GUI smoke test (headless)
        run: |
          xvfb-run -a ./build/app/soundpalette-app --smoke smoke.png --dir tests/golden/fixtures
          test -s smoke.png

      - name: Export palette sheet
        run: ./build/cli/soundpalette export-svg tests/golden/palette.json --out sheet.svg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: palette-artifacts
          path: |
            sheet.svg
            smoke.png
