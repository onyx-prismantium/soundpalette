name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (PLAN.md §2)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git pkg-config \
            xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libgl1-mesa-dev \
            libasound2-dev libpulse-dev \
            libgtk-3-dev libdbus-1-dev \
            ffmpeg libxml2-utils xvfb

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Generate test fixtures (deterministic, PLAN.md §11 + extension §7)
        run: |
          ./build/tools/genfixtures/genfixtures tests/golden/fixtures --extra fixtures_m9 --profile-set fixtures_m10
          bash tests/integration/make_lossy.sh tests/golden/fixtures

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Integration tests
        run: |
          for s in tests/integration/*.sh; do
            echo "== $s"
            bash "$s" || exit 1
          done

      - name: GUI smoke test (headless)
        run: |
          xvfb-run -a ./build/app/soundpalette-app --smoke smoke.png --dir tests/golden/fixtures
          test -s smoke.png

      - name: Deviation-view smoke tests (M11)
        run: |
          ./build/cli/soundpalette profile create fixtures_m10/catfx --name catfx \
            --category 'ui=ui/**,**/ui_*' --category 'combat=combat/**' \
            --out /tmp/catfx.sppal.json
          xvfb-run -a ./build/app/soundpalette-app --smoke halos.png \
            --dir fixtures_m10/catfx --profile /tmp/catfx.sppal.json --view grid
          xvfb-run -a ./build/app/soundpalette-app --smoke constellation.png \
            --dir fixtures_m10/catfx --profile /tmp/catfx.sppal.json --view constellation
          test -s halos.png && test -s constellation.png

      - name: Export palette sheet
        run: ./build/cli/soundpalette export-svg tests/golden/palette.json --out sheet.svg

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: palette-artifacts
          path: |
            sheet.svg
            smoke.png

  # Windows build parity (beyond the v1 plan, which scoped packaging but not portability out).
  # Differences from the Linux job, by necessity:
  #  - golden_scan.sh is skipped: the lossy fixtures' sha256 depends on the exact ffmpeg
  #    encoder build, so the committed golden manifest is only byte-valid for the Linux
  #    toolchain. Determinism is verified directly (two scans, two exports, byte-compare).
  #  - GUI smoke is skipped: hosted Windows runners have no GL 3.3-capable driver (no Mesa
  #    llvmpipe equivalent installed). The app target is still compiled and linked.
  #  - watch_update.sh is skipped: Git Bash delivers SIGTERM as a hard kill, so the clean-
  #    shutdown assertion cannot be expressed there.
  build-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Install ffmpeg (test fixtures only)
        run: choco install ffmpeg -y --no-progress

      - name: Generate test fixtures
        shell: bash
        run: |
          ./build/tools/genfixtures/genfixtures tests/golden/fixtures --extra fixtures_m9 --profile-set fixtures_m10
          bash tests/integration/make_lossy.sh tests/golden/fixtures

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: CLI determinism and lint checks
        shell: bash
        run: |
          ./build/cli/soundpalette scan tests/golden/fixtures --out a.json --quiet
          ./build/cli/soundpalette scan tests/golden/fixtures --out b.json --quiet
          cmp a.json b.json
          ./build/cli/soundpalette export-svg a.json --out s1.svg
          ./build/cli/soundpalette export-svg a.json --out s2.svg
          cmp s1.svg s2.svg
          ./build/cli/soundpalette scan tests/golden/fixtures/darkset --out base.json --quiet
          ./build/cli/soundpalette lint tests/golden/fixtures/darkset --baseline base.json --threshold 4.0
          ./build/cli/soundpalette print-mapping > /dev/null
